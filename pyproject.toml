[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-classification-agent"
version = "0.1.0"
description = "Member 4: academic text classification workflow and model integration"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0,<2",
  "pydantic>=2.7,<3",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.12,<1"]
model = ["torch==2.7.1", "transformers==4.53.2", "numpy==1.26.4"]
training = ["scikit-learn==1.5.0", "matplotlib==3.9.0", "seaborn==0.13.2"]
crawler = [
  "selenium==4.25.0", "webdriver-manager==4.0.2", "beautifulsoup4==4.12.3",
  "pandas==2.2.2", "tqdm>=4.66", "loguru>=0.7,<1",
]

[project.scripts]
academic-agent = "agent.cli:main"
academic-pipeline = "agent.pipeline:main"

[tool.setuptools.packages.find]
include = ["agent*", "model*", "preprocess*", "crawler*"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.package-data]
agent = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: explicit local MedBERT smoke tests; enable ACADEMIC_REAL_MODEL_TESTS=1"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "backend", "frontend", "presentation", "crawler", "preprocess", "model",
  "tests/test_preprocess_upstream.py", "agent/tools/base.py", "agent/tools/clean_dataset.py",
  "agent/tools/train_model.py", "agent/tools/serve_web.py", "agent/prompts",
  "config.py", "run_crawl.py", "run_preprocess.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
